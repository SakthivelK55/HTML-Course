<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
</head>
<body>
    <h1>Student form for choosing courses</h1>

    <form action="" autocomplete="off" method="get">
        <fieldset>
            <legend>Student form Details</legend>
        <label for="sname"> Student name:</label>
        <input type="text"  placeholder="Enter here you name" id="sname" name="stuName"> <br><br>
        <label for="phno."> Phone number:</label>
        <input type="number" placeholder="Enter your phone number" id="phno." name="stuPh" minlength="10">  <br><br>
        <label for="pswd">Password:</label>
        <input type="password" placeholder="Enter the password" id="pswd"  name="stuPass" minlength="5"> <br><br>
        <label for="eml"> Email id:</label>
        <input type="email"  placeholder="Enter your Email" value="abc" id="eml" name="Email"> <br><br>
        <lebel for="age" >Age</lebel>
        <input type="number" name="stuAge" id="age"> <br><br>

        <label for="">subjects</label> <br><br>
        <label for="sub1"> HTML</label>
         <input type="checkbox" name="sub1" id="sub1" value="html">

        <label for="sub2"> CSS</label>
        <input type="checkbox" name="sub2" id="sub2" value="css">

        <label for="sub3"> JAVA SCRIPT</label>
        <input type="checkbox" name="sub3" id="sub3" value="js">  <br><br>

        <label for="gender">Select Gender:</label>  <br><br>
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="other">Female</label>  
        <input type="radio" id="male" name="gender" value="female">
        <label for="other">Others</label>  
        <input type="radio" id="other" name="gender" value="others">  <br><br>

        <label for="address">Address:</label>
        <textarea id="address" rows="10" cols="40" name="address" placeholder="Enter the address"></textarea><br><br>

        <label for="select the course" >Select the course:</label> <br><br>
        
        <select>
            <option>Selec the course</option>
            <option>HTML</option>
            <option>CSS</option>
            <option>JAVA SCRIPT</option>
            <option>JAVA</option>
            <option>python</option>
        </select>  <br><br>

        <label>Enter your date of birth:</label>
        <input type="date"> <br><br>
        
        <input type="submit" value="signup">
        <input type="reset" value="reset">
        <input type="button" value="disable" disabled>

        
        <button> Register </button> <br>

        </fieldset>
     </form>
</body>
</html>
